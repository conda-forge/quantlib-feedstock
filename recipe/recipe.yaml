schema_version: 1

context:
  name: QuantLib
  version: "1.43"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/lballabio/QuantLib/releases/download/v${{ version }}/${{ name }}-${{ version }}.tar.gz
  sha256: b41206ccc4ba39b5e86bdc940d51138222b352f79d2c6fc68649f9c9bbe58701
  file_name: ${{ name }}-${{ version }}.tar.gz
  patches:
    - 0001-Remove-use-of-BOOST_ALL_DYN_LINK.patch
    - 0002-automake-17.patch

build:
  number: 1
  skip: win and vc<14

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - if: unix
      then: autoconf
    - if: unix
      then: automake
    - cmake
    - if: unix
      then: make
    - if: win
      then: ninja
  host:
    - libboost-devel
  run:
  run_exports:
    - if: not win
      then: ${{ pin_subpackage('quantlib', upper_bound='x') }}

tests:
  - script:
      - if: win
        then: quantlib-test-suite --log_level=message
      - if: unix
        then: cd build && ./test-suite/quantlib-test-suite --log_level=message

about:
  license: BSD-3-Clause
  license_file: LICENSE.TXT
  summary: The QuantLib C++ library
  description: The QuantLib project (https://www.quantlib.org) is aimed at providing a comprehensive software framework for quantitative finance. QuantLib is a free/open-source library for modeling, trading, and risk management in real-life.
  homepage: https://github.com/lballabio/QuantLib
  repository: https://github.com/lballabio/QuantLib
  documentation: https://www.quantlib.org

extra:
  recipe-maintainers:
    - timkpaine
